    nx: 440
    ny: 500
    size_x: 2200
    size_y: 2500
    center_lon: 14.0
    center_lat: 56.0
    rot: 0
    N: 3
    theta_s: 5.0
    theta_b: 2.0
    hc: 250.0
    topography_source:
      name: ETOPO5

  # --- Western Australia ---

  western_australia:
    # Shifted W and trimmed cross-shore so E edge stops near the WA coast
