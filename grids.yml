# C-SON Grid Configurations
# size_x, size_y in km; rot in degrees CCW from east (xi-axis)
# rot = -coast_bearing so eta (size_y) runs along-coast
# Regional grids: 5 km resolution (nx = size_x/5, ny = size_y/5)
# Basin grids:    100 km resolution

grids:

  # --- Eastern Boundary Upwelling Systems ---

  california_current:
    state: Scientifically Validated
    grid_kwargs:
      nx: 672
      ny: 1320
      size_x: 2688
      size_y: 5280
      center_lon: -134.5
      center_lat: 39.6
      rot: 33.3
      N: 100
      theta_s: 6.0
      theta_b: 6.0
      hc: 250

  ca_1km:
    state: null
    # Nested inside california_current (CCS). Covers the California coast
    # (Cape Mendocino through Point Conception) plus a wide offshore margin.
    # A single rotated rectangle can't hug both the NNW- and W-trending
    # coastal segments at once, so the cross-shore extent (936 km) is wide
    # enough that the (curved) real coastline stays safely inside the onshore
    # edge everywhere along the domain, not just at the center latitude. The
    # center sits well offshore so most of that width is ocean rather than
    # interior land. Widened ~80% and lengthened ~50% relative to the initial
    # 520x1100 km footprint.
    grid_kwargs:
      nx: 936
      ny: 1650
      size_x: 936
      size_y: 1650
      center_lon: -125.0
      center_lat: 37.4
      rot: 27.6
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  montereybay_300m:
    state: null
    # Nested inside ca_1km. Footprint and rotation matched to NOAA's
    # WCOFS_150_MONTEREY_BAY nest (derived from its lon_rho/lat_rho/angle
    # fields), at 300m resolution. Covers the bay mouth/submarine canyon,
    # open shelf to the west, and both shores (Santa Cruz N, Point Lobos S).
    grid_kwargs:
      nx: 252
      ny: 438
      size_x: 75.6
      size_y: 131.4
      center_lon: -122.23
      center_lat: 36.78
      rot: 21.5
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  humboldt_current:
    state: null
    # Full S American west coast, south boundary past Cape Horn (~58°S).
    # Center shifted E and slightly widened so the E edge flares ~300 km
    # inland of the coast (Pierre-CCS style), keeping the shoreline firmly
    # inside the domain rather than at the grid boundary.
    grid_kwargs:
      nx: 440
      ny: 1300
      size_x: 2200
      size_y: 6500
      center_lon: -78.0
      center_lat: -27.0
      rot: 10    # coast bears ~345° (NNW), matches Colombia→Lima trend
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  benguela_current:
    state: null
    # South Angola toward the Cape; rotation reduced so the box aligns with the
    # near-N-S west coast and the SE corner sits at the shore (not inland)
    grid_kwargs:
      nx: 280
      ny: 520
      size_x: 1400
      size_y: 2600
      center_lon: 11.0
      center_lat: -18.0
      rot: 10     
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  canary_current:
    state: null
    # Trimmed cross-shore so NE corner stays off the Iberian peninsula
    grid_kwargs:
      nx: 400
      ny: 840
      size_x: 2000
      size_y: 4200
      center_lon: -17.0
      center_lat: 20.0
      rot: 0   # NW sAfrican coast bears ~25° (NNE)
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Gulf of Guinea ---

  gulf_of_guinea:
    state: null
    # Western boundary pushed out to ~-17°E (about halfway across the Canary
    # current grid), keeping the eastern Gulf coverage
    grid_kwargs:
      nx: 685
      ny: 340
      size_x: 3425
      size_y: 1700
      center_lon: -1.6
      center_lat: -1.0
      rot: 0
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- East Africa ---

  east_africa:
    state: null
    # Mozambique (~28°S) to Horn of Africa (~10°N); eta tilts NNE along coast.
    # Trimmed cross-shore so SW corner stays closer to Mozambique coast.
    grid_kwargs:
      nx: 360
      ny: 1000
      size_x: 1800
      size_y: 5000
      center_lon: 45.0
      center_lat: -12.0
      rot: -20   # coast bears ~20° (NNE) averaged Mozambique→Somalia
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- South Africa (Cape + Agulhas) ---

  south_africa:
    state: null
    # Cape + Agulhas; widened ~20% in x and extended ~20% further south to take
    # in more of the Agulhas retroflection and the Southern Ocean fronts
    grid_kwargs:
      nx: 672
      ny: 480
      size_x: 3360
      size_y: 2400
      center_lon: 24.0
      center_lat: -36.8
      rot: 0
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Arabian Sea ---

  arabian_sea:
    state: null
    # Shifted north and lengthened so N edge reaches the Persian Gulf
    grid_kwargs:
      nx: 720
      ny: 600
      size_x: 3600
      size_y: 3000
      center_lon: 61.0
      center_lat: 18.0
      rot: 0     # basin domain
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Red Sea ---

  red_sea:
    state: null
    # Narrow NW-SE channel from the Gulfs of Suez/Aqaba down to the
    # Bab-el-Mandeb strait; eta runs along the basin axis
    grid_kwargs:
      nx: 100
      ny: 440
      size_x: 500
      size_y: 2200
      center_lon: 38.4
      center_lat: 20.4
      rot: 31    # -coast_bearing; basin axis bears ~NNW
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Western Atlantic (U.S. East Coast + Gulf of Mexico) ---

  western_atlantic:
    state: null
    # Center shifted E and trimmed cross-shore so SW corner doesn't cross
    # central Mexico to the Pacific
    grid_kwargs:
      nx: 700
      ny: 1100
      size_x: 3500
      size_y: 5500
      center_lon: -75.0
      center_lat: 30.0
      rot: -35   # coast bears ~20° (NNE)
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Amazon Outflow ---

  amazon_outflow:
    state: null
    # Amazon River mouth (~50°W, 0°N) and the NW-trending outflow plume
    # along the Brazilian/Guianan coast toward the Caribbean
    grid_kwargs:
      nx: 400
      ny: 900
      size_x: 2000
      size_y: 4500
      center_lon: -48.0
      center_lat: 2.0
      rot: 50    # coast/plume bears ~300° (NW)
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Kuroshio ---

  kuroshio:
    state: null
    # China coast (SW corner) to Russia/Kamchatka (NW corner); center
    # shifted E and trimmed so SW corner sits near eastern China rather
    # than deep interior
    grid_kwargs:
      nx: 600
      ny: 900
      size_x: 3000
      size_y: 4500
      center_lon: 140.0
      center_lat: 40.0
      rot: -45   # coast/current bears ~45° (NE)
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Mediterranean ---

  mediterranean:
    state: null
    # Rotated CCW and extended to capture the Black Sea; western edge held at
    # Gibraltar; enlarged in y to take in the full southern (N African) coast
    grid_kwargs:
      nx: 880
      ny: 400
      size_x: 4400
      size_y: 2000
      center_lon: 21.0
      center_lat: 39.5
      rot: 8     # CCW tilt lifts the eastern end up to the Black Sea
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Northern Europe ---

  iceland_0:
    state: Scientifically Validated
    # Baltic Sea + North Sea; northern edge ~level with Iceland
    # Trimmed E-W so E edge stops near the Baltic instead of pushing
    # into Russia/Belarus
    grid_kwargs:
      nx: 512
      ny: 512
      size_x: 1280
      size_y: 1280
      center_lon: -35
      center_lat: 63
      rot: -20
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Western Australia ---

  western_australia:
    state: null
    # Shifted W and trimmed cross-shore so E edge stops near the WA coast
    # instead of crossing into the interior
    grid_kwargs:
      nx: 300
      ny: 700
      size_x: 1500
      size_y: 3500
      center_lon: 112.0
      center_lat: -26.0
      rot: 15    # WA coast bears ~345° (NNW)
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Oceania + Maritime Continent ---

  oceania:
    state: null
    # Shifted E to start near Indochina rather than reaching into India;
    # south boundary still ~-20°S (about 1/3 down the Australian continent)
    grid_kwargs:
      nx: 1200
      ny: 700
      size_x: 6000
      size_y: 3500
      center_lon: 130.0
      center_lat: -3.0
      rot: -35
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  # --- Basin-scale grids (100 km resolution) ---

  pacific-100km:
    state: Scientifically Validated
    grid_kwargs:
      nx: 230
      ny: 120
      size_x: 23000
      size_y: 12000
      center_lon: -161.0
      center_lat: 14.4
      rot: -3.0
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  atlantic-100km:
    state: Scientifically Validated
    grid_kwargs:
      nx: 100
      ny: 140
      size_x: 10500
      size_y: 14000
      center_lon: -35.0
      center_lat: 9.0
      rot: 23
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0

  indian-100km:
    state: Functionally Validated
    grid_kwargs:
      nx: 110
      ny: 95
      size_x: 11000
      size_y: 9500
      center_lon: 65.0
      center_lat: -10.0
      rot: 0
      N: 3
      theta_s: 5.0
      theta_b: 2.0
      hc: 250.0
