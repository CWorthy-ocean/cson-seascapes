    nx: 300
    ny: 700
    size_x: 1500
    size_y: 3500
    center_lon: 112.0
    center_lat: -26.0
    rot: 15    # WA coast bears ~345° (NNW)
    N: 3
    theta_s: 5.0
    theta_b: 2.0
    hc: 250.0
    topography_source:
      name: ETOPO5

  # --- Oceania + Maritime Continent ---

  oceania:
    # Shifted E to start near Indochina rather than reaching into India;
